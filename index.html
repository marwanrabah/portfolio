<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Marawan Rabah</title>
  <script src="https://player.vimeo.com/api/player.js"></script>
  <script src="content/content.js?v=project-swipe"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&family=Space+Mono:wght@400&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #040404;
      --surface: #0c0c0c;
      --border: #1c1c1c;
      --text: #f0f0f0;
      --muted: #555;
      --accent: #e8e8e8;
    }

    html {
      scroll-behavior: smooth;
      overflow-x: hidden;
      overscroll-behavior-x: none;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 300;
      width: 100%;
      overflow-x: hidden;
      overscroll-behavior-x: none;
    }

    /* ── HERO ─────────────────────────────────────── */
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 600px;
      background: url('media/hero/banner.jpg') center / cover no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(4,4,4,0.25) 0%,
        rgba(4,4,4,0.55) 60%,
        rgba(4,4,4,1) 100%
      );
    }

    .hero-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .profile-ring {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      padding: 2px;
      background: linear-gradient(135deg, #fff2 0%, #fff6 50%, #fff1 100%);
    }

    .profile-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      filter: grayscale(15%);
    }

    .hero-name {
      font-size: clamp(28px, 5vw, 52px);
      font-weight: 300;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #fff;
    }

    .hero-title {
      font-family: 'Space Mono', monospace;
      font-size: clamp(10px, 1.4vw, 13px);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .hero-scroll-cue {
      position: absolute;
      right: 50%;
      bottom: 30px;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,0.58);
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.16em;
      text-decoration: none;
      text-transform: uppercase;
      transform: translateX(50%);
      transition: color 0.2s ease;
    }

    .hero-scroll-cue:hover { color: #fff; }

    /* ── CONTACT ──────────────────────────────────── */
    .contact {
      display: flex;
      justify-content: center;
      gap: 16px;
      padding: 32px 20px 48px;
      border-bottom: 1px solid var(--border);
    }

    .contact a {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      border: 1px solid var(--border);
      padding: 10px 20px;
      transition: color 0.2s, border-color 0.2s;
    }

    .contact a:hover { color: var(--text); border-color: #444; }

    .contact svg { flex-shrink: 0; }

    /* ── SECTION LABEL ────────────────────────────── */
    .section-label {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 52px 40px 24px;
    }

    /* ── VIDEOS ───────────────────────────────────── */
    .video-scroll-wrap {
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0 40px 40px;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .video-scroll-wrap::-webkit-scrollbar { display: none; }

    .video-track {
      display: flex;
      gap: 16px;
      width: max-content;
    }

    .video-card {
      position: relative;
      flex-shrink: 0;
      width: 340px;
      height: 220px;
      background: var(--surface);
      border: 1px solid var(--border);
      cursor: pointer;
      overflow: hidden;
    }

    .video-card.reel-card {
      width: 260px;
      height: 462px;
    }

    .video-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .video-card video.contain-video {
      object-fit: contain;
      background: #000;
    }

    .video-card iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      pointer-events: none;
    }

    .video-poster {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      z-index: 2;
      pointer-events: none;
      background: #000;
    }

    .mute-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 32px;
      height: 32px;
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translate(-50%, -50%);
      transition: opacity 0.2s;
      pointer-events: auto;
      cursor: pointer;
      padding: 0;
      z-index: 3;
    }

    .video-card:hover .mute-overlay { opacity: 1; }
    .mute-overlay { opacity: 0.5; }
    .video-card.is-playing .mute-overlay {
      opacity: 0;
      pointer-events: none;
    }
    .video-card.is-playing:hover .mute-overlay {
      opacity: 1;
      pointer-events: auto;
    }

    /* ── PROJECTS (carousels) ─────────────────────── */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
      padding: 0 40px 56px;
    }

    .project-card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      aspect-ratio: 4 / 3;
      overflow: hidden;
      touch-action: pan-y;
    }

    .project-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.35s ease;
    }

    .carousel-nav {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .project-card:hover .carousel-nav { opacity: 1; }

    .carousel-btn {
      width: 30px;
      height: 30px;
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      flex-shrink: 0;
    }

    .carousel-btn:hover { background: rgba(0,0,0,0.9); }

    .carousel-counter {
      position: absolute;
      bottom: 10px;
      right: 12px;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.5);
      pointer-events: none;
    }

    .project-title-bar {
      padding: 10px 12px;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }

    /* ── SOCIAL PROOF ─────────────────────────────── */
    .proof-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      padding: 0 40px 80px;
    }

    .proof-card {
      aspect-ratio: 9 / 16;
      background: var(--surface);
      border: 1px dashed var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .proof-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .proof-placeholder {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.3em;
      color: #222;
      text-transform: uppercase;
    }

    /* ── FOOTER ───────────────────────────────────── */
    footer {
      border-top: 1px solid var(--border);
      padding: 24px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: #2a2a2a;
      text-transform: uppercase;
    }

    /* ── DRAG-TO-SCROLL (videos) ─────────────────── */
    .dragging { cursor: grabbing !important; user-select: none; }

    /* ── INTERACTION LAYER ───────────────────────── */
    button, a, .video-card, .project-card { -webkit-tap-highlight-color: transparent; }

    :focus-visible {
      outline: 1px solid rgba(255,255,255,0.75);
      outline-offset: 3px;
    }

    .video-scroll-wrap {
      scroll-snap-type: x mandatory;
      scroll-padding-inline: 20px;
      touch-action: pan-x;
      -webkit-overflow-scrolling: touch;
    }

    .video-card { scroll-snap-align: center; }

    .video-card > video,
    .video-card > iframe { position: relative; z-index: 1; }

    .video-card.is-loading::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 28px;
      height: 28px;
      z-index: 5;
      border: 2px solid rgba(255,255,255,0.22);
      border-top-color: var(--text);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: media-spin 0.8s linear infinite;
      pointer-events: none;
    }

    .video-card.is-loading .media-controls { opacity: 0.55; }

    @keyframes media-spin {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .play-feedback {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 54px;
      height: 54px;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 50%;
      background: rgba(4,4,4,0.68);
      color: #fff;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.78);
      pointer-events: none;
    }

    .play-feedback svg { width: 20px; height: 20px; fill: currentColor; stroke: currentColor; stroke-width: 2; }
    .play-feedback.is-visible { animation: playback-feedback 0.72s ease-out both; }

    @keyframes playback-feedback {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.78); }
      18% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      72% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.06); }
    }

    .media-controls {
      position: absolute;
      right: 10px;
      bottom: 10px;
      padding: 4px;
      display: flex;
      align-items: center;
      gap: 5px;
      z-index: 4;
      pointer-events: none;
      opacity: 1;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 999px;
      background: rgba(4,4,4,0.72);
      box-shadow: 0 8px 24px rgba(0,0,0,0.28);
      backdrop-filter: blur(10px);
      transition: opacity 0.2s ease;
    }

    .media-controls button {
      position: relative;
      width: 34px;
      min-width: 34px;
      height: 34px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      cursor: pointer;
      pointer-events: auto;
      opacity: 0.85;
    }

    .media-controls button:hover,
    .media-controls button:focus-visible { background: rgba(255,255,255,0.12); opacity: 1; }
    .media-controls svg { width: 14px; height: 14px; fill: currentColor; stroke: currentColor; stroke-width: 2; }
    .media-controls button::after {
      content: attr(data-label);
      position: absolute;
      right: 0;
      bottom: calc(100% + 8px);
      display: none;
      padding: 5px 7px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(4,4,4,0.94);
      color: #fff;
      font-family: 'Space Mono', monospace;
      font-size: 8px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
    }

    .media-controls button:hover::after,
    .media-controls button:focus-visible::after { display: block; }

    .media-progress {
      position: absolute;
      right: 10px;
      bottom: 6px;
      left: 10px;
      z-index: 4;
      width: calc(100% - 20px);
      height: 3px;
      margin: 0;
      opacity: 0;
      accent-color: var(--text);
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .video-card:hover .media-progress,
    .video-card:focus-within .media-progress,
    .video-card.is-playing .media-progress { opacity: 0.8; }

    .media-progress:disabled { display: none; }

    .media-error {
      position: absolute;
      inset: auto 8px 8px;
      z-index: 5;
      padding: 8px;
      color: #fff;
      background: rgba(0,0,0,0.76);
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.08em;
      text-align: center;
      text-transform: uppercase;
      pointer-events: none;
    }

    .section-reveal {
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.32s ease, transform 0.32s ease;
    }

    .section-reveal.is-visible { opacity: 1; transform: none; }

    body.viewer-open { overflow: hidden; }

    .media-viewer {
      width: min(100vw, 1120px);
      height: min(100vh, 820px);
      max-width: none;
      max-height: none;
      padding: 20px;
      border: 1px solid var(--border);
      background: rgba(4,4,4,0.98);
      color: var(--text);
    }

    .media-viewer::backdrop { background: rgba(0,0,0,0.88); }
    .viewer-shell { width: 100%; height: 100%; display: grid; grid-template-rows: auto 1fr auto; gap: 14px; }
    .viewer-header, .viewer-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .viewer-title { display: none; }
    .viewer-counter { margin-left: auto; color: rgba(255,255,255,0.45); font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.12em; }
    .viewer-media { position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; touch-action: pan-y; }
    .viewer-media.is-loading::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 30px;
      height: 30px;
      border: 2px solid rgba(255,255,255,0.22);
      border-top-color: #fff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: media-spin 0.8s linear infinite;
      pointer-events: none;
    }
    .viewer-media video, .viewer-media iframe { width: 100%; height: 100%; border: 0; object-fit: contain; background: #000; }
    .viewer-hint { position: absolute; left: 50%; bottom: 18px; z-index: 3; padding: 8px 10px; border: 1px solid rgba(255,255,255,0.16); background: rgba(4,4,4,0.76); color: rgba(255,255,255,0.78); font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; transform: translateX(-50%); transition: opacity 0.3s ease; pointer-events: none; }
    .viewer-hint.is-hidden { opacity: 0; }
    .viewer-button { width: 34px; height: 34px; border: 1px solid var(--border); background: var(--surface); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .viewer-button:hover { border-color: #444; }
    .viewer-button svg { width: 15px; height: 15px; fill: currentColor; stroke: currentColor; stroke-width: 2; }
    .viewer-nav { display: flex; gap: 8px; }

    .end-cta { padding: 56px 20px 64px; border-top: 1px solid var(--border); text-align: center; }
    .end-cta p { margin-bottom: 18px; color: var(--muted); font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; }
    .end-cta-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .end-cta a { display: inline-flex; align-items: center; gap: 9px; padding: 10px 20px; border: 1px solid var(--border); color: var(--muted); font-size: 12px; letter-spacing: 0.15em; text-decoration: none; text-transform: uppercase; transition: color 0.2s, border-color 0.2s; }
    .end-cta a:hover { border-color: #444; color: var(--text); }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .section-reveal, .project-card img, .media-controls, .media-progress { transition: none; }
      .video-card.is-loading::before { animation: none; }
      .viewer-media.is-loading::after { animation: none; }
      .play-feedback.is-visible { animation: none; opacity: 1; transform: translate(-50%, -50%); }
    }

    @media (max-width: 640px) {
      .section-label { padding: 40px 20px 20px; }
      .video-scroll-wrap { padding: 0 20px 32px; }
      .projects-grid, .proof-grid { padding: 0 20px 48px; }
      footer { padding: 20px; flex-direction: column; gap: 8px; }
      .video-card { width: min(340px, calc(100vw - 40px)); }
      .video-card.reel-card { width: min(260px, calc(100vw - 56px)); }
      .media-viewer { width: 100vw; height: 100dvh; padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); border: 0; }
      .viewer-counter { margin-left: 0; }
      .end-cta { padding: 44px 20px 52px; }
    }
  </style>
</head>
